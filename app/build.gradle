plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'app.voltforge'
    compileSdk 34
    defaultConfig { applicationId 'app.voltforge'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' }
    signingConfigs {
        release {
            def f = System.getenv('KS_FILE')
            if (f) {
                storeFile file(f); storePassword System.getenv('KS_PASS')
                keyAlias 'voltforge'; keyPassword System.getenv('KS_PASS')
                enableV1Signing = true; enableV2Signing = true; enableV3Signing = true
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
}
